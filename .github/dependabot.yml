# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Maintain dependencies for pnpm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      build:
        patterns:
          - mdsvex
          - sass
          - "svelte"
          - "svelte-*"
          - "@sveltejs/*"
          - typescript
          - vite
      test:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      lint:
        patterns:
          - "prettier"
          - "prettier-*"
          - "stylelint"
          - "stylelint-*"
    ignore:
      # svelte-check does not yet support a plain TypeScript 7 install; it
      # requires TS 6 and TS 7 side by side plus the experimental --tsgo flag.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/visreg/playwright"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
