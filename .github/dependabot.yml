# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Maintain dependencies for pnpm. Minor and patch updates are grouped by
  # dependency type and run monthly; major updates get their own PR so a
  # breaking change doesn't hold back the rest. Security updates arrive
  # separately as advisories are published, grouped into a single PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # svelte-check does not yet support a plain TypeScript 7 install; it
      # requires TS 6 and TS 7 side by side plus the experimental --tsgo flag.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/visreg/playwright"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
