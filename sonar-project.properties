# Project info
sonar.organization=vws
sonar.projectKey=nl-rdo-manon
sonar.projectName=nl-rdo-manon

# Info links shown in SonarCloud
sonar.links.homepage=https://github.com/minvws/nl-rdo-manon

# Source encoding
sonar.sourceEncoding=UTF-8

# Analysis scoping
sonar.sources=docs,examples,manon,themes

# Test coverage, produced by `pnpm run --dir manon test:coverage`. The report
# paths are rebased onto the repository root so the scanner can resolve them.
sonar.javascript.lcov.reportPaths=manon/coverage/lcov.info
